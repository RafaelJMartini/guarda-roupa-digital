<!DOCTYPE html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Novo anúncio · Guarda-Roupa Digital</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap" rel=stylesheet><style>*{box-sizing:border-box;margin:0}body{font:15px/1.4 system-ui,sans-serif;background:#d9ddd6;color:#1c2b24}
h1,h3{font-family:Fraunces,Georgia,serif}h3{margin:14px 0 4px}
.app{max-width:430px;min-height:100vh;margin:auto;background:#f4f5f1;padding:0 14px 96px}
header{display:flex;align-items:center;gap:10px;padding:14px 0;position:sticky;top:0;background:#f4f5f1;z-index:5}
header h1{font-size:22px;flex:1}.back{font-size:22px;text-decoration:none;color:inherit}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#fff;border-top:1px solid #cfd5cc;z-index:6}
nav a{flex:1;text-align:center;padding:8px 0;font-size:11px;color:#667;text-decoration:none}nav a b{display:block;font-size:20px}nav a.on{color:#1f4d3a;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.card{background:#fff;border-radius:6px 6px 14px 14px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid #dde2da;position:relative;display:block}
.tile{height:130px;display:grid;place-items:center;font-size:54px}.big{height:240px;border-radius:16px;font-size:100px;margin:6px 0}
.in{padding:8px 10px;font-size:13px}.in b{display:block;font-size:14px}
.tag{position:absolute;top:8px;left:8px;background:#1f4d3a;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.fav{position:absolute;top:6px;right:8px;font-size:22px;color:#c2255c;background:none;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#1f4d3a;color:#fff;font:600 15px system-ui;text-align:center;text-decoration:none;margin:8px 0;cursor:pointer}
.btn.sec{background:#fff;color:#1f4d3a;border:1.5px solid #1f4d3a}.btn.red{background:#c2255c}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #c5ccc2;border-radius:10px;font:inherit;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tabs{display:flex;gap:6px;overflow:auto;margin:6px 0}
.chip,.opt{padding:6px 12px;border:1px solid #c5ccc2;border-radius:99px;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on,.opt.on{background:#1f4d3a;color:#fff;border-color:#1f4d3a}
.box{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #dde2da;display:block;text-decoration:none;color:inherit}.warn{background:#fdf0c9;border-color:#ecd48a}
.row{display:flex;gap:8px}.row>*{flex:1}.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eceee9;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stats div{background:#fff;border:1px solid #dde2da;border-radius:12px;padding:10px 4px;text-align:center;font-size:11px}.stats b{display:block;font-size:22px;font-family:Fraunces,Georgia,serif}
.li{display:flex;gap:10px;align-items:center}.li .tile{width:64px;height:64px;font-size:30px;border-radius:10px;flex:none}.li>div:last-child{flex:1}
.fab{position:fixed;bottom:78px;right:max(14px,calc(50% - 201px));width:52px;height:52px;border-radius:50%;background:#1f4d3a;color:#fff;font-size:28px;display:grid;place-items:center;text-decoration:none;z-index:6}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20}.md{background:#fff;border-radius:16px;padding:20px;width:min(340px,90%)}.md p{color:#455;margin:6px 0 12px}
.sheet{position:fixed;bottom:0;left:50%;width:100%;max-width:430px;transform:translate(-50%,100%);transition:.25s;background:#fff;border-radius:20px 20px 0 0;padding:16px;z-index:15;max-height:80vh;overflow:auto;box-shadow:0 -4px 20px #0003}.sheet.open{transform:translate(-50%,0)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1c2b24;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:14px}
.dot{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c5ccc2}</style></head><body><div class=app><header><a class=back href="peca-detalhe.html">←</a><h1>Novo anúncio</h1></header><div class=box><div class=li><div class=tile style="background:#c9d6e8">🧥</div><div><b>Jaqueta jeans</b><br><small>Casacos · M · Azul</small></div></div></div><label>Título *</label><input value="Jaqueta jeans M"><label>Descrição</label><textarea rows=3 placeholder="Estado, medidas, detalhes..."></textarea>
<label>Tipo</label><div class=chips data-single><span class="opt on">Venda</span><span class=opt>Troca</span><span class=opt>Venda ou troca</span></div>
<label>Preço (R$) *</label><input id=preco type=number value=120>
<div class="box warn">Comissão (10%): <b id=com>R$ 12,00</b><br>Você recebe: <b id=rec>R$ 108,00</b><br><small>Brechós têm comissão 0%.</small></div>
<label>O que aceita em troca?</label><input placeholder="Ex.: camisas M"><label class=box style="display:flex;gap:8px;font-weight:400"><input type=checkbox style=width:auto> Destacar anúncio (R$ 4,90 por 7 dias)</label>
<button class=btn data-pop="Anúncio publicado!|Sua peça já aparece no marketplace.|meus-anuncios.html">Publicar anúncio</button></div><script>const $=s=>document.querySelector(s);
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(t,m,go,ask){let o=document.createElement('div');o.className='ov';o.innerHTML='<div class=md><h3>'+t+'</h3><p>'+m+'</p><div class=row>'+(ask?'<button class="btn sec" data-x>Cancelar</button>':'')+'<button class=btn data-ok>'+(ask?'Confirmar':'OK')+'</button></div></div>';document.body.appendChild(o);o.onclick=e=>{if(e.target==o||e.target.dataset.x!==undefined)o.remove();if(e.target.dataset.ok!==undefined){o.remove();if(go)location.href=go}}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-pop]');
if(b){e.preventDefault();let[t,m,go,ask]=b.dataset.pop.split('|');modal(t,m,go,ask);return}
b=e.target.closest('[data-toast]');if(b){e.preventDefault();toast(b.dataset.toast);return}
b=e.target.closest('[data-sheet]');if(b){e.preventDefault();$('#'+b.dataset.sheet).classList.toggle('open');return}
b=e.target.closest('[data-tab]');if(b){b.parentElement.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=b.dataset.tab);return}
b=e.target.closest('.fav');if(b){e.preventDefault();b.classList.toggle('on');b.textContent=b.classList.contains('on')?'♥':'♡';return}
b=e.target.closest('.chip,.opt');if(b){let p=b.parentElement;if(p.hasAttribute('data-single'))p.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.toggle('on')}});$('#preco').oninput=function(){let v=+this.value||0,f=n=>'R$ '+n.toFixed(2).replace('.',',');$('#com').textContent=f(v*.1);$('#rec').textContent=f(v*.9)}</script></body></html>
